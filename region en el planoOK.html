<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Inecuaciones Lineales</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --success-color: #16a34a;
      --error-color: #dc2626;
      --text-color: #1e293b;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-color);
    }

    .stats {
      display: flex;
      gap: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .stat-badge {
      background-color: #eff6ff;
      color: var(--primary-color);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .canvas-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .instruction {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      touch-action: manipulation;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-color);
      background-color: #f8fafc;
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background-color: #dcfce7 !important;
      border-color: var(--success-color) !important;
      color: #15803d !important;
    }

    .option-btn.incorrect {
      background-color: #fee2e2 !important;
      border-color: var(--error-color) !important;
      color: #b91c1c !important;
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.8;
    }

    .feedback {
      min-height: 24px;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
    }

    .feedback.success {
      color: var(--success-color);
    }

    .feedback.error {
      color: var(--error-color);
    }

    .next-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
      display: none;
    }

    .next-btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title">Semicuantos y Semipianos</div>
      <div class="stats">
        <div class="stat-badge">Aciertos: <span id="score">0</span></div>
        <div class="stat-badge">Racha: <span id="streak">0</span></div>
      </div>
    </div>

    <div class="canvas-container">
      <svg id="plot" viewBox="-11 -11 22 22">
        <defs>
          <pattern id="grid" width="1" height="1" patternUnits="userSpaceOnUse">
            <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#e2e8f0" stroke-width="0.08"/>
          </pattern>
        </defs>
        <rect x="-11" y="-11" width="22" height="22" fill="url(#grid)" />
        <g id="region-group"></g>
        <g id="axes-group"></g>
        <g id="line-group"></g>
      </svg>
    </div>

    <div class="instruction">Selecciona la inecuación representada:</div>

    <div class="options-grid" id="options-container">
      <button class="option-btn" onclick="checkAnswer(0)"></button>
      <button class="option-btn" onclick="checkAnswer(1)"></button>
      <button class="option-btn" onclick="checkAnswer(2)"></button>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="generateNewProblem()">Siguiente ejercicio</button>
  </div>

  <script>
    const RANGE = 10;
    const SVG_SIZE = 22;

    let currentProblem = null;
    let score = 0;
    let streak = 0;
    let answered = false;

    function getRandomInt(min, max, excludeZero = false) {
      let val;
      do {
        val = Math.floor(Math.random() * (max - min + 1)) + min;
      } while (excludeZero && val === 0);
      return val;
    }

    function formatInequality(m, b, op) {
      let termX = '';
      if (m === 1) termX = 'x';
      else if (m === -1) termX = '-x';
      else if (m !== 0) termX = `${m}x`;

      let termB = '';
      if (b > 0) termB = termX ? ` + ${b}` : `${b}`;
      else if (b < 0) termB = termX ? ` - ${Math.abs(b)}` : `-${Math.abs(b)}`;
      else if (!termX) termB = '0';

      let symbol = op;
      if (op === '>=') symbol = '≥';
      if (op === '<=') symbol = '≤';

      return `y ${symbol} ${termX}${termB}`;
    }

    function generateProblem() {
      const m = getRandomInt(-3, 3, true);
      const b = getRandomInt(-5, 5);
      const ops = ['>', '>=', '<', '<='];
      const correctOp = ops[Math.floor(Math.random() * ops.length)];

      const correctExpr = formatInequality(m, b, correctOp);

      const distractors = new Set();
      
      const strictFlip = { '>': '>=', '>=': '>', '<': '<=', '<=': '<' };
      distractors.add(formatInequality(m, b, strictFlip[correctOp]));

      const dirFlip = { '>': '<', '>=': '<=', '<': '>', '<=': '>=' };
      distractors.add(formatInequality(m, b, dirFlip[correctOp]));

      distractors.add(formatInequality(-m, b, correctOp));
      distractors.add(formatInequality(m, -b, correctOp));

      const optionsList = Array.from(distractors).filter(item => item !== correctExpr);
      
      const finalOptions = [correctExpr];
      while (finalOptions.length < 3 && optionsList.length > 0) {
        const idx = Math.floor(Math.random() * optionsList.length);
        finalOptions.push(optionsList.splice(idx, 1)[0]);
      }

      for (let i = finalOptions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [finalOptions[i], finalOptions[j]] = [finalOptions[j], finalOptions[i]];
      }

      return {
        m, b, op: correctOp,
        correctIndex: finalOptions.indexOf(correctExpr),
        options: finalOptions
      };
    }

    function drawPlot(m, b, op) {
      const axesGroup = document.getElementById('axes-group');
      const lineGroup = document.getElementById('line-group');
      const regionGroup = document.getElementById('region-group');

      axesGroup.innerHTML = '';
      lineGroup.innerHTML = '';
      regionGroup.innerHTML = '';

      const xAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      xAxis.setAttribute('x1', -11); xAxis.setAttribute('y1', 0);
      xAxis.setAttribute('x2', 11);  xAxis.setAttribute('y2', 0);
      xAxis.setAttribute('stroke', '#64748b'); xAxis.setAttribute('stroke-width', '0.25');

      const yAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      yAxis.setAttribute('x1', 0); yAxis.setAttribute('y1', -11);
      yAxis.setAttribute('x2', 0); yAxis.setAttribute('y2', 11);
      yAxis.setAttribute('stroke', '#64748b'); yAxis.setAttribute('stroke-width', '0.25');

      axesGroup.appendChild(xAxis);
      axesGroup.appendChild(yAxis);

      for (let i = -10; i <= 10; i += 2) {
        if (i === 0) continue;
        const tickX = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        tickX.setAttribute('x', i); tickX.setAttribute('y', 1.2);
        tickX.setAttribute('font-size', '0.8'); tickX.setAttribute('text-anchor', 'middle');
        tickX.setAttribute('fill', '#94a3b8'); tickX.textContent = i;
        axesGroup.appendChild(tickX);

        const tickY = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        tickY.setAttribute('x', -0.8); tickY.setAttribute('y', -i + 0.3);
        tickY.setAttribute('font-size', '0.8'); tickY.setAttribute('text-anchor', 'end');
        tickY.setAttribute('fill', '#94a3b8'); tickY.textContent = i;
        axesGroup.appendChild(tickY);
      }

      const xLeft = -15;
      const xRight = 15;
      const yLeftMath = m * xLeft + b;
      const yRightMath = m * xRight + b;

      const yLeftSvg = -yLeftMath;
      const yRightSvg = -yRightMath;

      const isGreater = op.includes('>');
      const yTopCorner = isGreater ? -15 : 15;

      const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      const points = `${xLeft},${yLeftSvg} ${xRight},${yRightSvg} ${xRight},${yTopCorner} ${xLeft},${yTopCorner}`;
      polygon.setAttribute('points', points);
      polygon.setAttribute('fill', 'rgba(37, 99, 235, 0.25)');
      regionGroup.appendChild(polygon);

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', xLeft);
      line.setAttribute('y1', yLeftSvg);
      line.setAttribute('x2', xRight);
      line.setAttribute('y2', yRightSvg);
      line.setAttribute('stroke', '#1d4ed8');

      const isStrict = (op === '>' || op === '<');
      if (isStrict) {
        line.setAttribute('stroke-width', '0.2');
        line.setAttribute('stroke-dasharray', '0.3, 0.3');
        line.setAttribute('stroke-linecap', 'round');
      } else {
        line.setAttribute('stroke-width', '0.25');
      }

      lineGroup.appendChild(line);
    }

    function generateNewProblem() {
      answered = false;
      currentProblem = generateProblem();
      
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('next-btn').style.display = 'none';

      drawPlot(currentProblem.m, currentProblem.b, currentProblem.op);

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, index) => {
        btn.textContent = currentProblem.options[index];
        btn.className = 'option-btn';
        btn.disabled = false;
      });
    }

    function checkAnswer(selectedIndex) {
      if (answered) return;
      answered = true;

      const buttons = document.querySelectorAll('.option-btn');
      const feedbackEl = document.getElementById('feedback');

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIndex === currentProblem.correctIndex) {
        buttons[selectedIndex].classList.add('correct');
        feedbackEl.textContent = '¡Correcto!';
        feedbackEl.className = 'feedback success';
        score += 10;
        streak += 1;
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[currentProblem.correctIndex].classList.add('correct');
        feedbackEl.textContent = 'Incorrecto. Observa la frontera y la región.';
        feedbackEl.className = 'feedback error';
        streak = 0;
      }

      document.getElementById('score').textContent = score;
      document.getElementById('streak').textContent = streak;
      document.getElementById('next-btn').style.display = 'block';
    }

    generateNewProblem();
  </script>
</body>
</html>
