<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Inverso: Evaluando Puntos</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --success-color: #16a34a;
      --error-color: #dc2626;
      --text-color: #1e293b;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-color);
    }

    .inequality-display {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-color);
      background-color: #eff6ff;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #bfdbfe;
    }

    .canvas-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .instruction {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      touch-action: manipulation;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-color);
      background-color: #f8fafc;
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background-color: #dcfce7 !important;
      border-color: var(--success-color) !important;
      color: #15803d !important;
    }

    .option-btn.incorrect {
      background-color: #fee2e2 !important;
      border-color: var(--error-color) !important;
      color: #b91c1c !important;
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.8;
    }

    .feedback {
      min-height: 24px;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
    }

    .feedback.success {
      color: var(--success-color);
    }

    .feedback.error {
      color: var(--error-color);
    }

    .next-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
      display: none;
    }

    .next-btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title">Evaluación de Puntos</div>
    </div>

    <div class="inequality-display" id="inequality-text">y &ge; 2x - 1</div>

    <div class="canvas-container">
      <svg id="plot" viewBox="-11 -11 22 22">
        <defs>
          <pattern id="grid" width="1" height="1" patternUnits="userSpaceOnUse">
            <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#e2e8f0" stroke-width="0.08"/>
          </pattern>
        </defs>
        <rect x="-11" y="-11" width="22" height="22" fill="url(#grid)" />
        <g id="region-group"></g>
        <g id="axes-group"></g>
        <g id="line-group"></g>
        <g id="points-group"></g>
      </svg>
    </div>

    <div class="instruction">¿Cuál par ordenado satisface la inecuación?</div>

    <div class="options-grid" id="options-container">
      <button class="option-btn" onclick="checkAnswer(0)"></button>
      <button class="option-btn" onclick="checkAnswer(1)"></button>
      <button class="option-btn" onclick="checkAnswer(2)"></button>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="generateNewProblem()">Siguiente ejercicio</button>
  </div>

  <script>
    let currentProblem = null;
    let answered = false;

    function getRandomInt(min, max, excludeZero = false) {
      let val;
      do {
        val = Math.floor(Math.random() * (max - min + 1)) + min;
      } while (excludeZero && val === 0);
      return val;
    }

    function formatInequality(m, b, op) {
      let termX = '';
      if (m === 1) termX = 'x';
      else if (m === -1) termX = '-x';
      else if (m !== 0) termX = `${m}x`;

      let termB = '';
      if (b > 0) termB = termX ? ` + ${b}` : `${b}`;
      else if (b < 0) termB = termX ? ` - ${Math.abs(b)}` : `-${Math.abs(b)}`;
      else if (!termX) termB = '0';

      let symbol = op;
      if (op === '>=') symbol = '≥';
      if (op === '<=') symbol = '≤';

      return `y ${symbol} ${termX}${termB}`;
    }

    function evaluatesInequality(px, py, m, b, op) {
      const lineY = m * px + b;
      switch (op) {
        case '>': return py > lineY;
        case '>=': return py >= lineY;
        case '<': return py < lineY;
        case '<=': return py <= lineY;
        default: return false;
      }
    }

    function formatPoint(pt) {
      return `(${pt.x}; ${pt.y})`;
    }

    function generateProblem() {
      const m = getRandomInt(-2, 2, true);
      const b = getRandomInt(-4, 4);
      const ops = ['>', '>=', '<', '<='];
      const op = ops[Math.floor(Math.random() * ops.length)];

      let validPoint = null;
      let invalidPoints = [];

      while (!validPoint) {
        const px = getRandomInt(-7, 7);
        const py = getRandomInt(-7, 7);
        
        const isOnLine = (py === m * px + b);
        if ((op === '>' || op === '<') && isOnLine) continue;

        if (evaluatesInequality(px, py, m, b, op)) {
          validPoint = { x: px, y: py };
        }
      }

      while (invalidPoints.length < 2) {
        const px = getRandomInt(-7, 7);
        const py = getRandomInt(-7, 7);
        
        const isCandidateValid = evaluatesInequality(px, py, m, b, op);
        const isAlreadyAdded = invalidPoints.some(pt => pt.x === px && pt.y === py) || (validPoint.x === px && validPoint.y === py);

        if (!isCandidateValid && !isAlreadyAdded) {
          invalidPoints.push({ x: px, y: py });
        }
      }

      const allPoints = [
        { ...validPoint, isCorrect: true },
        { ...invalidPoints[0], isCorrect: false },
        { ...invalidPoints[1], isCorrect: false }
      ];

      for (let i = allPoints.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allPoints[i], allPoints[j]] = [allPoints[j], allPoints[i]];
      }

      const correctIndex = allPoints.findIndex(pt => pt.isCorrect);

      return {
        m, b, op,
        points: allPoints,
        correctIndex
      };
    }

    function drawPlot(m, b, op) {
      const axesGroup = document.getElementById('axes-group');
      const lineGroup = document.getElementById('line-group');
      const regionGroup = document.getElementById('region-group');
      const pointsGroup = document.getElementById('points-group');

      axesGroup.innerHTML = '';
      lineGroup.innerHTML = '';
      regionGroup.innerHTML = '';
      pointsGroup.innerHTML = '';

      // Ejes
      const xAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      xAxis.setAttribute('x1', -11); xAxis.setAttribute('y1', 0);
      xAxis.setAttribute('x2', 11);  xAxis.setAttribute('y2', 0);
      xAxis.setAttribute('stroke', '#64748b'); xAxis.setAttribute('stroke-width', '0.18');

      const yAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      yAxis.setAttribute('x1', 0); yAxis.setAttribute('y1', -11);
      yAxis.setAttribute('x2', 0); yAxis.setAttribute('y2', 11);
      yAxis.setAttribute('stroke', '#64748b'); yAxis.setAttribute('stroke-width', '0.18');

      axesGroup.appendChild(xAxis);
      axesGroup.appendChild(yAxis);

      // Marcas
      for (let i = -10; i <= 10; i += 2) {
        if (i === 0) continue;
        const tickX = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        tickX.setAttribute('x', i); tickX.setAttribute('y', 1.2);
        tickX.setAttribute('font-size', '0.8'); tickX.setAttribute('text-anchor', 'middle');
        tickX.setAttribute('fill', '#94a3b8'); tickX.textContent = i;
        axesGroup.appendChild(tickX);

        const tickY = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        tickY.setAttribute('x', -0.8); tickY.setAttribute('y', -i + 0.3);
        tickY.setAttribute('font-size', '0.8'); tickY.setAttribute('text-anchor', 'end');
        tickY.setAttribute('fill', '#94a3b8'); tickY.textContent = i;
        axesGroup.appendChild(tickY);
      }

      // Región Sombreada
      const xLeft = -15;
      const xRight = 15;
      const yLeftMath = m * xLeft + b;
      const yRightMath = m * xRight + b;

      const yLeftSvg = -yLeftMath;
      const yRightSvg = -yRightMath;

      const isGreater = op.includes('>');
      const yTopCorner = isGreater ? -15 : 15;

      const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      const polyPoints = `${xLeft},${yLeftSvg} ${xRight},${yRightSvg} ${xRight},${yTopCorner} ${xLeft},${yTopCorner}`;
      polygon.setAttribute('points', polyPoints);
      polygon.setAttribute('fill', 'rgba(37, 99, 235, 0.22)');
      regionGroup.appendChild(polygon);

      // Línea Frontera
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', xLeft);
      line.setAttribute('y1', yLeftSvg);
      line.setAttribute('x2', xRight);
      line.setAttribute('y2', yRightSvg);
      line.setAttribute('stroke', '#1d4ed8');
      line.setAttribute('stroke-width', '0.22');

      if (op === '>' || op === '<') {
        line.setAttribute('stroke-dasharray', '0.5, 0.5');
      }

      lineGroup.appendChild(line);
    }

    function renderPointOnPlot(pt, isCorrect) {
      const pointsGroup = document.getElementById('points-group');
      const svgY = -pt.y;
      
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', pt.x);
      circle.setAttribute('cy', svgY);
      circle.setAttribute('r', '0.35');
      circle.setAttribute('fill', isCorrect ? '#16a34a' : '#dc2626');
      circle.setAttribute('stroke', '#ffffff');
      circle.setAttribute('stroke-width', '0.1');

      const labelText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      labelText.setAttribute('x', pt.x + 0.5);
      labelText.setAttribute('y', svgY - 0.5);
      labelText.setAttribute('font-size', '0.8');
      labelText.setAttribute('font-weight', 'bold');
      labelText.setAttribute('fill', isCorrect ? '#15803d' : '#b91c1c');
      labelText.textContent = formatPoint(pt);

      pointsGroup.appendChild(circle);
      pointsGroup.appendChild(labelText);
    }

    function generateNewProblem() {
      answered = false;
      currentProblem = generateProblem();
      
      document.getElementById('inequality-text').textContent = formatInequality(currentProblem.m, currentProblem.b, currentProblem.op);
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('next-btn').style.display = 'none';

      drawPlot(currentProblem.m, currentProblem.b, currentProblem.op);

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, index) => {
        const pt = currentProblem.points[index];
        btn.textContent = formatPoint(pt);
        btn.className = 'option-btn';
        btn.disabled = false;
      });
    }

    function checkAnswer(selectedIndex) {
      if (answered) return;
      answered = true;

      const buttons = document.querySelectorAll('.option-btn');
      const feedbackEl = document.getElementById('feedback');

      buttons.forEach(btn => btn.disabled = true);

      const selectedPoint = currentProblem.points[selectedIndex];
      const isCorrect = selectedIndex === currentProblem.correctIndex;

      renderPointOnPlot(selectedPoint, isCorrect);

      if (isCorrect) {
        buttons[selectedIndex].classList.add('correct');
        feedbackEl.textContent = '¡Correcto! El punto pertenece a la región.';
        feedbackEl.className = 'feedback success';
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[currentProblem.correctIndex].classList.add('correct');
        
        renderPointOnPlot(currentProblem.points[currentProblem.correctIndex], true);

        feedbackEl.textContent = 'Incorrecto. El punto marcado no cumple la inecuación.';
        feedbackEl.className = 'feedback error';
      }

      document.getElementById('next-btn').style.display = 'block';
    }

    // Inicializar juego
    generateNewProblem();
  </script>
</body>
</html>
